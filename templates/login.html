{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-center h-screen">
  <form method="post" action="/login" class="bg-slate-800 p-6 rounded shadow-md w-80">
    <h2 class="text-cyan-400 text-lg mb-4">Login</h2>
    {% if error %}
      <p class="text-red-400 mb-2">{{ error }}</p>
    {% endif %}
    <label class="block mb-2 text-gray-300">Username</label>
    <input type="text" name="username" class="w-full p-2 mb-4 rounded bg-slate-700 text-white">
    <label class="block mb-2 text-gray-300">Password</label>
    <input type="password" name="password" class="w-full p-2 mb-4 rounded bg-slate-700 text-white">
    <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-600 text-white py-2 rounded">Login</button>
  </form>
</div>
{% endblock %}
